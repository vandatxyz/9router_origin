services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      DATA_DIR: /app/data
      HOSTNAME: 0.0.0.0
      PORT: 20128
      MITM_STANDALONE_MODE: "1"
    volumes:
      - 9router-data:/app/data

  9router-mitm:
    image: decolua/9router:latest
    container_name: 9router-mitm
    restart: unless-stopped
    depends_on:
      - 9router
    ports:
      - "443:443"
    environment:
      DATA_DIR: /app/data
      RUN_MODE: mitm
      MITM_ROUTER_BASE: http://9router:20128
    volumes:
      - 9router-data:/app/data

volumes:
  9router-data:
